name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          ARGS=""
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ARGS="-PksFile=$RUNNER_TEMP/release.jks -PksPass=$KS_PASS -PksAlias=$KS_ALIAS -PksKeyPass=$KS_KEY_PASS"
            echo "signing: release keystore from secrets"
          else
            echo "signing: debug keystore (add KEYSTORE_BASE64 secret for a stable signature)"
          fi
          gradle assembleRelease $ARGS --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          set -e
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/mdreader-${{ github.run_number }}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: mdreader-apk
          path: out/*.apk
          if-no-files-found: error
